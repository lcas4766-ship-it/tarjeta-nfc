<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depósito a Javier</title>
<style>
  :root { --bg:#0f1222; --card:#1a1f3a; --line:#2a3159; --text:#f2f4ff; --muted:#9aa3c7; --accent:#6c8cff; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border-radius:20px; padding:24px; }
  h1 { margin:0 0 4px; font-size:1.4rem; }
  .sub { margin:0 0 20px; color:var(--muted); font-size:.95rem; }
  .dato { padding:14px 0; border-top:1px solid var(--line); }
  .etiqueta { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; }
  .valor { margin:4px 0 10px; font-size:1.15rem; font-weight:600; word-break:break-all; user-select:text; }
  button { padding:11px 14px; border:0; border-radius:10px; font-size:.95rem; font-weight:600;
           background:var(--accent); color:#fff; cursor:pointer; }
  .dato button { width:100%; }
  #todo { width:100%; margin-top:14px; padding:14px; font-size:1rem; background:transparent; border:2px solid var(--accent); }
  button.ok { background:var(--ok); border-color:var(--ok); }
  button:active { transform:scale(.98); }
</style>
</head>
<body>

<!-- ============================================================
     EDITA SOLO ESTA PARTE: cambia el texto entre comillas.
     ============================================================ -->
<script>
  const DATOS = {
    titulo:   "Depósito a Javier",
    subtitulo:"Copia los datos para hacer tu transferencia",
    titular:  "NOMBRE DEL TITULAR",
    banco:    "NOMBRE DEL BANCO",
    cuenta:   "NÚMERO DE CUENTA"
  };
</script>
<!-- ============================================================ -->

<main>
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>

  <div class="dato">
    <div class="etiqueta">Titular</div>
    <div class="valor" id="titular"></div>
    <button type="button" data-copiar="titular">Copiar titular</button>
  </div>
  <div class="dato">
    <div class="etiqueta">Banco</div>
    <div class="valor" id="banco"></div>
    <button type="button" data-copiar="banco">Copiar banco</button>
  </div>
  <div class="dato">
    <div class="etiqueta">Número de cuenta</div>
    <div class="valor" id="cuenta"></div>
    <button type="button" data-copiar="cuenta">Copiar número de cuenta</button>
  </div>

  <button id="todo" type="button">Copiar todos los datos</button>
</main>

<script>
  for (const k of Object.keys(DATOS)) {
    const el = document.getElementById(k);
    if (el) el.textContent = DATOS[k];
  }
  document.title = DATOS.titulo;

  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = texto; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
  }
  function aviso(btn) {
    const original = btn.textContent;
    btn.textContent = '¡Copiado!'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('ok'); }, 1800);
  }
  document.querySelectorAll('[data-copiar]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await copiar(DATOS[btn.dataset.copiar]); aviso(btn);
    });
  });
  document.getElementById('todo').addEventListener('click', async (e) => {
    await copiar(`Titular: ${DATOS.titular}\nBanco: ${DATOS.banco}\nNúmero de cuenta: ${DATOS.cuenta}`);
    aviso(e.currentTarget);
  });
</script>
</body>
</html>
