<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta NFC</title>
<style>
  :root { --bg:#0f1222; --card:#1a1f3a; --text:#f2f4ff; --muted:#9aa3c7; --accent:#6c8cff; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border-radius:20px; padding:24px; }
  h1 { margin:0 0 16px; font-size:1.3rem; }
  #texto { margin:0 0 20px; font-size:1.05rem; line-height:1.55; white-space:pre-wrap; user-select:text; }
  button { width:100%; padding:14px; border:0; border-radius:12px; font-size:1rem; font-weight:600;
           background:var(--accent); color:#fff; cursor:pointer; }
  button.ok { background:var(--ok); }
  button:active { transform:scale(.98); }
</style>
</head>
<body>
<main>
  <h1>Título</h1>
  <p id="texto">Aquí va el texto que mañana vamos a modificar.</p>
  <button id="copiar" type="button">Copiar texto</button>
</main>
<script>
  const btn = document.getElementById('copiar');
  const texto = document.getElementById('texto');
  btn.addEventListener('click', async () => {
    const t = texto.innerText;
    try {
      await navigator.clipboard.writeText(t);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    btn.textContent = '¡Copiado!'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = 'Copiar texto'; btn.classList.remove('ok'); }, 1800);
  });
</script>
</body>
</html>
